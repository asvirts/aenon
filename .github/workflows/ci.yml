name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, build and size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # Temporary: 30 MB of incompressible data stands in for an over-budget asset, to show the size step failing.
      - run: head -c 30000000 /dev/urandom > dist/over-budget-stand-in.bin
      # Fails above the 40 MB first-load budget from #41 and prints the figure on every run.
      - run: npm run size
