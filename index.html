<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aenon — Season MVP</title>
    <style>
      html, body { height: 100%; }
      body { margin: 0; background: #0b1116; color: #f2ede0; font: 15px/1.5 system-ui, sans-serif; overflow: hidden; }
      main { margin: 0; padding: 0; height: 100dvh; position: relative; }
      #game { width: 100vw; height: 100dvh; }
      #game canvas { display: block; margin: 0 auto; }
      #passage {
        position: absolute; left: 12px; right: 12px; bottom: 12px;
        border: 1px solid #3a4a58; border-radius: 8px; padding: 12px 16px;
        background: rgba(11, 17, 22, 0.94); max-height: 32dvh; overflow: auto;
      }
      #passage:empty { display: none; }
      #passage h2 { font-size: 16px; margin: 0 0 6px; }
      #passage p { margin: 0; color: #c9d4de; }
    </style>
  </head>
  <body>
    <main>
      <div id="game"></div>
      <section id="passage" aria-live="polite"></section>
    </main>
    <script type="module" src="/src/host/main.ts"></script>
  </body>
</html>
