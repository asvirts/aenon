<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qwantani environment converter</title>
<style>
  body { max-width: 56rem; margin: 3rem auto; padding: 0 1rem; font: 16px/1.5 system-ui; background: #f8f5ec; color: #292d23; }
  button, a { font: inherit; } button { padding: .65rem 1rem; } pre { white-space: pre-wrap; }
</style>
<h1>Qwantani environment converter</h1>
<p>Development tool: convert the retained CC0 HDR into a 256px Babylon environment. Run after performance measurements. This page does not load the game.</p>
<button id="convert" disabled>Loading converter…</button>
<a id="download" hidden download="qwantani-puresky.env">Download environment</a>
<canvas id="gpu" width="16" height="16" aria-label="Conversion GPU surface"></canvas>
<pre id="status" role="status">Loading modules…</pre>
<script type="module">
  import { prefilterEnvironment } from './prefilter-environment.ts'
  const button = document.querySelector('#convert')
  const status = document.querySelector('#status')
  const download = document.querySelector('#download')
  window.__environmentProgress = []
  function report(message) {
    window.__environmentProgress.push({ elapsedMs: Math.round(performance.now()), message })
    status.textContent = message
    console.info('[environment converter]', message)
  }
  window.addEventListener('error', event => report(`Browser error: ${event.message}`))
  window.addEventListener('unhandledrejection', event => report(`Unhandled error: ${String(event.reason)}`))
  button.disabled = false
  button.textContent = 'Convert HDR to .env'
  report('Ready. Start conversion.')
  button.addEventListener('click', () => {
    button.disabled = true
    window.__environmentExport = prefilterEnvironment(report, document.querySelector('#gpu'))
    window.__environmentExport.then(result => {
      window.__environmentExportResult = result
      download.href = URL.createObjectURL(new Blob([result.bytes], { type: 'application/octet-stream' }))
      download.hidden = false
      report(`Complete: ${result.bytes.byteLength.toLocaleString()} bytes. Ready to download.`)
    }).catch(error => {
      window.__environmentExportError = String(error.stack ?? error)
      report(`Failed: ${String(error.message ?? error)} Reload this page before retrying.`)
    })
  })
</script>
</html>
